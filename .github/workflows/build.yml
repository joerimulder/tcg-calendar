name: Build Basel calendar

on:
  schedule:
    - cron: "17 3 * * *"     # nightly, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_calendar.py, data/**, .github/workflows/build.yml]

permissions:
  contents: write

concurrency:
  group: build-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_build.py
      - run: python build_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "tcgcalendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/*.ics data/geocodes.json
          git diff --cached --quiet || (git commit -m "Update calendar feeds" && git pull --rebase origin main && git push)
