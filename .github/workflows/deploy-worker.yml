name: Deploy custom-feed worker

# Publishes worker/ to Cloudflare Workers. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (token from the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (shown on the Workers & Pages overview page)
on:
  push:
    branches: [main]
    paths: [worker/**, tests/test_worker.mjs, .github/workflows/deploy-worker.yml]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_worker.mjs
      - name: Deploy
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Skipped deploy
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the worker was tested but not deployed."
